<div class="bg-gray-900 w-full flex justify-between p-1 title-bar">
	<div class="w-full flex items-center text-gray-400 text-sm ml-2 p-1">
		<img class="w-16" alt="logo" src="assets/logos/logo-text-white.svg" />
	</div>
	<div class="w-full flex justify-end items-center">
		<div class="w-fit no-drag flex justify-end items-center">
			@if (isDebugAllowed | async) {
				<fkt-icon
					(click)="openDevTools()"
					name="wrench-screwdriver"
					class="text-white size-6 bg-transparent size-8 flex justify-center items-center hover:bg-gray-700 cursor-pointer transition rounded-md"
				/>
			}

			<fkt-icon
				(click)="minimize()"
				name="minus"
				class="text-white size-6 bg-transparent size-8 flex justify-center items-center hover:bg-gray-700 cursor-pointer transition rounded-md"
			/>
			<fkt-icon
				(click)="maximize()"
				name="stop"
				class="text-white size-6 bg-transparent size-8 flex justify-center items-center hover:bg-gray-700 cursor-pointer transition rounded-md"
			/>
			<fkt-icon
				(click)="close()"
				name="x-mark"
				class="text-white size-6 bg-transparent size-8 flex justify-center items-center hover:bg-red-500 cursor-pointer transition rounded-md"
			/>
		</div>
	</div>
</div>
