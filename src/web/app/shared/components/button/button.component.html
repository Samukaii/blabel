<button [disabled]="disabled() || loading()" [class]="classes()">
	@if (loading()) {
		<div class="spinner"></div>
		<p>{{ loadingText() || text() }}</p>
	} @else {
		<div
			[class.flex-row-reverse]="iconPosition() === 'left'"
			class="flex gap-2 items-center"
		>
			@let iconName = icon();
			@if (text()) {
				<p>{{ text() }}</p>
			}
			@if (iconName) {
				<app-icon class="transition rounded-full" [name]="iconName"></app-icon>
			}
		</div>
	}
</button>
