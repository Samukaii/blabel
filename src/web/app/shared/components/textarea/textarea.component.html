<div class="flex gap-2 items-center">
  <label [class.!text-red-500]="!!error.message()" class="text-gray-800 font-medium text-sm mb-1">{{ label() }}</label>
</div>

<textarea
  [class.!border-red-500]="!!error.message()"
  class="!border-[1px] border-transparent"
  #textarea
  [placeholder]="placeholder()"
  [formControl]="control()"
></textarea>

<app-field-error #error [control]="control()"/>
